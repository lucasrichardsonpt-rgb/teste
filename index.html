<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f2ff">
<title>Simulador: tomar comprimido 💊</title>
<style>
  :root{
    --pele:#ffe0c9;      --pele-esc:#f4c3a4;
    --cabelo:#ffb3d1;    --cabelo-esc:#f58cb6;
    --roupa:#b9dcff;     --roupa-esc:#8fc4f5;
    --traco:#6d5b80;
    --texto:#54456b;
    --lilas:#b79cf0;
    --rosa:#ff9ec4;
    --fundo1:#fdf4ff;    --fundo2:#eef4ff;
    /* raio-x */
    --x-corpo:rgba(120,160,255,.16);
    --x-linha:#a9d8ff;
    --x-fundo1:#3a3576;  --x-fundo2:#241f52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overflow-x:clip}
  body{
    margin:0;min-height:100%;overflow-x:clip;
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    color:var(--texto);
    background:linear-gradient(160deg,var(--fundo1),var(--fundo2));
    -webkit-user-select:none;user-select:none;
    transition:background .8s ease, color .8s ease;
  }
  body.xray{
    background:radial-gradient(circle at 50% 40%,var(--x-fundo1),var(--x-fundo2));
    color:#dbe8ff;
  }

  .app{
    position:relative;
    min-height:100dvh;max-width:540px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 12px 18px;
  }

  h1{
    font-size:clamp(.95rem,4.2vw,1.25rem);font-weight:800;
    margin:6px 0 0;text-align:center;padding:0 46px;letter-spacing:.2px;
  }

  /* ---- balão de fala ---- */
  .balao{
    width:100%;margin:8px 0 6px;padding:9px 14px;border-radius:20px;
    background:#fff;border:3px solid var(--lilas);
    box-shadow:0 5px 0 rgba(183,156,240,.25);
    font-size:clamp(.85rem,3.6vw,1rem);line-height:1.35;text-align:center;
    min-height:56px;display:flex;align-items:center;justify-content:center;
    color:var(--texto);
    transition:background-color .5s ease,border-color .5s ease,color .5s ease,transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  body.xray .balao{background:rgba(255,255,255,.1);border-color:var(--x-linha);color:#eaf3ff}
  .balao.pop{transform:scale(1.04)}
  .balao span{display:block;animation:sobe .5s ease both}
  @keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* ---- palco ---- */
  .palco{position:relative;width:100%;flex:1 1 auto;min-height:240px;max-height:60dvh}
  svg#cena{position:absolute;inset:0;width:100%;height:100%}

  /* peças do corpo trocam de cor no raio-x */
  .pele,.roupa,.cabelo,.contorno,.pelestroke{transition:fill .7s ease,stroke .7s ease,opacity .7s ease}
  .xray .pele,.xray .roupa,.xray .cabelo{fill:var(--x-corpo)}
  .xray .contorno{stroke:var(--x-linha)}
  .xray .pelestroke{stroke:rgba(150,190,255,.25)}
  .xray .detalhe{opacity:.35}
  #interior{opacity:0;transition:opacity .7s ease}
  .xray #interior{opacity:1}
  #luzXray{opacity:0;transition:opacity .7s ease}
  .xray #luzXray{opacity:1}

  /* ---- painel de botões ---- */
  .painel{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
  .painel .largo{grid-column:1 / -1}
  button{
    font-family:inherit;font-weight:800;font-size:clamp(.85rem,3.6vw,1rem);
    color:#fff;border:none;border-radius:16px;padding:13px 10px;min-height:50px;
    cursor:pointer;background:linear-gradient(180deg,#b79cf0,#9d7fe8);
    box-shadow:0 4px 0 #7f63c9;
    transition:transform .2s ease,opacity .45s ease,box-shadow .2s ease,filter .45s ease;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #7f63c9}
  button[disabled]{opacity:.42;filter:grayscale(.5);cursor:default}
  button.destaque{background:linear-gradient(180deg,#ff9ec4,#f57ba9);box-shadow:0 4px 0 #d95f8c}
  button.destaque:active{box-shadow:0 1px 0 #d95f8c}
  button.xrayOn{background:linear-gradient(180deg,#7fd0ff,#4aa8e8);box-shadow:0 4px 0 #3182b8}
  button.pisca{animation:chama 1.6s ease-in-out infinite}
  @keyframes chama{0%,100%{transform:none}50%{transform:scale(1.04)}}

  #btnSom{
    position:absolute;top:8px;right:10px;width:40px;height:40px;min-height:40px;
    padding:0;border-radius:50%;background:#fff;color:var(--texto);
    border:2px solid var(--lilas);box-shadow:0 3px 0 rgba(183,156,240,.45);
    display:flex;align-items:center;justify-content:center;font-size:1rem;
  }
  body.xray #btnSom{background:rgba(255,255,255,.15);color:#eaf3ff}

  .rodape{margin-top:10px;font-size:.72rem;opacity:.6;text-align:center;line-height:1.45}

  /* telemóvel deitado: painel numa linha só, para sobrar altura ao personagem */
  @media (max-height:600px){
    .app{padding:4px 10px 8px}
    h1{font-size:.9rem;margin-top:0}
    .balao{min-height:38px;padding:5px 10px;margin:4px 0 3px;font-size:.8rem}
    .palco{min-height:140px;max-height:64dvh}
    .rodape{display:none}
    .painel{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px}
    .painel .largo{grid-column:auto}
    button{min-height:44px;padding:7px 4px;font-size:.7rem;border-radius:12px}
    #btnSom{width:30px;height:30px;min-height:30px;top:2px;right:2px;font-size:.8rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div class="app">
  <button id="btnSom" aria-label="Ligar ou desligar o som">🔊</button>
  <h1 id="titulo">Simulador: como o comprimido desce 💊</h1>

  <div class="balao" id="balao"><span id="msg">Oi! Eu sou a Mia. Clique num botão que eu faço! Pode ligar o raio-X na hora que quiser 😊</span></div>

  <div class="palco">
    <svg id="cena" viewBox="0 0 420 640" aria-label="Personagem Mia, vista de frente">
      <defs>
        <radialGradient id="gPele" cx="38%" cy="32%">
          <stop offset="0%" stop-color="#fff2e6"/><stop offset="70%" stop-color="#ffe0c9"/><stop offset="100%" stop-color="#f6c9ac"/>
        </radialGradient>
        <radialGradient id="gCabelo" cx="35%" cy="25%">
          <stop offset="0%" stop-color="#ffc9e0"/><stop offset="100%" stop-color="#f58cb6"/>
        </radialGradient>
        <linearGradient id="gRoupa" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cfe7ff"/><stop offset="100%" stop-color="#8fc4f5"/>
        </linearGradient>
        <radialGradient id="gLuz" cx="50%" cy="45%">
          <stop offset="0%" stop-color="#bcd8ff" stop-opacity=".30"/>
          <stop offset="100%" stop-color="#bcd8ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gTubo" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7fb2ff" stop-opacity=".40"/>
          <stop offset="45%" stop-color="#cfe8ff" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#7fb2ff" stop-opacity=".40"/>
        </linearGradient>
        <linearGradient id="gAgua" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9ad4ff" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#63a8f0" stop-opacity=".55"/>
        </linearGradient>
        <clipPath id="cortaCopo"><path id="formaCopo" d="M-26 -46 h52 l-7 84 a9 9 0 0 1 -9 8 h-20 a9 9 0 0 1 -9 -8 z"/></clipPath>
      </defs>

      <!-- brilho de raio-x atrás do corpo -->
      <ellipse id="luzXray" cx="210" cy="360" rx="200" ry="270" fill="url(#gLuz)"/>

      <!-- sombra no chão -->
      <ellipse cx="210" cy="606" rx="130" ry="18" fill="#000" opacity=".07"/>

      <!-- ================= CORPO ================= -->
      <!-- pernas -->
      <path class="roupa contorno" d="M168 520 q-6 46 2 74 h34 q4-40 6-74 z" fill="#a9b6e8" stroke="var(--traco)" stroke-width="6" stroke-linejoin="round"/>
      <path class="roupa contorno" d="M252 520 q6 46 -2 74 h-34 q-4-40 -6-74 z" fill="#a9b6e8" stroke="var(--traco)" stroke-width="6" stroke-linejoin="round"/>

      <!-- braço esquerdo (parado) -->
      <path class="contorno" d="M126 350 q-26 60 -14 108" fill="none" stroke="var(--traco)" stroke-width="26" stroke-linecap="round"/>
      <path class="pelestroke" d="M126 350 q-26 60 -14 108" fill="none" stroke="#ffe0c9" stroke-width="16" stroke-linecap="round"/>
      <circle class="pele contorno" cx="114" cy="466" r="16" fill="url(#gPele)" stroke="var(--traco)" stroke-width="6"/>

      <!-- tronco -->
      <path id="tronco" class="roupa contorno"
            d="M210 296 q-64 6 -80 44 q-16 40 -12 106 q-2 46 6 78 q42 12 86 12 t86-12 q8-32 6-78 q4-66 -12-106 q-16-38 -80-44 z"
            fill="url(#gRoupa)" stroke="var(--traco)" stroke-width="6" stroke-linejoin="round"/>
      <path class="detalhe" d="M178 306 q32 26 64 0" fill="none" stroke="var(--roupa-esc)" stroke-width="6" stroke-linecap="round"/>

      <!-- pescoço -->
      <path id="pescoco" class="pele contorno" d="M176 244 h68 v56 q-34 14 -68 0 z" fill="url(#gPele)" stroke="var(--traco)" stroke-width="6" stroke-linejoin="round"/>

      <!-- ============ INTERIOR (raio-X) ============ -->
      <g id="interior">
        <!-- tubo da garganta: da boca até o estômago -->
        <path d="M176 212 C 170 280, 170 330, 178 382 L 242 382 C 250 330, 250 280, 244 212 Z"
              fill="url(#gTubo)" stroke="var(--x-linha)" stroke-width="5" stroke-linejoin="round" opacity=".95"/>
        <!-- estômago -->
        <path d="M196 380 q-46 16 -52 62 q-6 52 52 60 q56 8 68 -44 q10 -50 -30 -76 z"
              fill="url(#gTubo)" stroke="var(--x-linha)" stroke-width="5" stroke-linejoin="round" opacity=".95"/>
        <!-- água acumulada no estômago -->
        <path id="aguaEstomago" d="M152 452 q6 48 56 50 q54 4 62 -50 z" fill="url(#gAgua)" opacity="0"/>

        <!-- etiquetas -->
        <g font-size="15" font-weight="700" font-family="inherit">
          <g>
            <rect x="282" y="240" width="82" height="24" rx="12" fill="#1e1b4a" opacity=".6"/>
            <text x="323" y="257" text-anchor="middle" fill="var(--x-linha)">garganta</text>
            <line x1="248" y1="252" x2="282" y2="252" stroke="var(--x-linha)" stroke-width="2.5" opacity=".7"/>
          </g>
          <g>
            <rect x="163" y="486" width="88" height="24" rx="12" fill="#1e1b4a" opacity=".6"/>
            <text x="207" y="503" text-anchor="middle" fill="var(--x-linha)">estômago</text>
          </g>
        </g>

        <!-- comparação de tamanho: a garganta é MUITO mais larga que o comprimido -->
        <g id="medida" opacity="0">
          <line x1="176" y1="344" x2="244" y2="344" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 5"/>
          <line x1="176" y1="336" x2="176" y2="352" stroke="#ffd166" stroke-width="3.5"/>
          <line x1="244" y1="336" x2="244" y2="352" stroke="#ffd166" stroke-width="3.5"/>
          <rect x="252" y="332" width="136" height="24" rx="12" fill="#1e1b4a" opacity=".6"/>
          <text x="320" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd166" font-family="inherit">olha como é larga!</text>
        </g>

        <!-- água que empurra o comprimido -->
        <g id="aguaDescendo" opacity="0">
          <ellipse cx="210" cy="0" rx="20" ry="12" fill="#9ad4ff" opacity=".55"/>
          <ellipse cx="196" cy="-16" rx="8" ry="6" fill="#cfe8ff" opacity=".5"/>
          <ellipse cx="222" cy="-22" rx="6" ry="5" fill="#cfe8ff" opacity=".45"/>
        </g>

        <!-- comprimido dentro do corpo -->
        <g id="pilulaDentro" opacity="0">
          <g id="pilulaDentroRot">
            <rect x="-9" y="-4.5" width="18" height="9" rx="4.5" fill="#fff" stroke="#2b2b5a" stroke-width="2"/>
            <path d="M0 -4.5 h4.5 a4.5 4.5 0 0 1 0 9 h-4.5 z" fill="#a9d8ff" stroke="#2b2b5a" stroke-width="2"/>
          </g>
        </g>

        <!-- estrelinha ao chegar -->
        <g id="estrela" opacity="0" transform="translate(252,414)">
          <g id="estrelaEscala">
            <path d="M0 -24 L7 -8 L25 -6 L12 6 L16 23 L0 14 L-16 23 L-12 6 L-25 -6 L-7 -8 Z"
                  fill="#ffd166" stroke="#fff3cf" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="-6" cy="-2" r="2.2" fill="#8a6d1f"/><circle cx="6" cy="-2" r="2.2" fill="#8a6d1f"/>
            <path d="M-6 5 q6 6 12 0" fill="none" stroke="#8a6d1f" stroke-width="2.4" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- ================= CABEÇA ================= -->
      <ellipse class="cabelo contorno" cx="210" cy="168" rx="108" ry="104" fill="url(#gCabelo)" stroke="var(--traco)" stroke-width="6"/>
      <ellipse class="pele contorno" cx="210" cy="176" rx="94" ry="92" fill="url(#gPele)" stroke="var(--traco)" stroke-width="6"/>
      <!-- franja -->
      <path class="cabelo contorno" d="M116 152 q8-88 94-88 t94 88 q-14-42 -28-54 q-24 28 -66 28 t-66-28 q-14 12 -28 54 z"
            fill="url(#gCabelo)" stroke="var(--traco)" stroke-width="6" stroke-linejoin="round"/>
      <!-- laço -->
      <g class="detalhe" transform="translate(302,104) rotate(16)">
        <path d="M0 0 l-26-15 0 30 z" fill="#ff9ec4" stroke="var(--traco)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M0 0 l26-15 0 30 z" fill="#ff9ec4" stroke="var(--traco)" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="8" fill="#fff0f6" stroke="var(--traco)" stroke-width="4"/>
      </g>

      <!-- rosto -->
      <g class="detalhe" id="olhos">
        <ellipse id="olhoE" cx="178" cy="168" rx="11" ry="14" fill="var(--traco)"/>
        <circle cx="182" cy="163" r="4" fill="#fff"/>
        <ellipse id="olhoD" cx="242" cy="168" rx="11" ry="14" fill="var(--traco)"/>
        <circle cx="246" cy="163" r="4" fill="#fff"/>
        <path d="M164 144 q14-9 28-2" fill="none" stroke="var(--traco)" stroke-width="5" stroke-linecap="round"/>
        <path d="M228 142 q14-7 28 2" fill="none" stroke="var(--traco)" stroke-width="5" stroke-linecap="round"/>
      </g>
      <ellipse class="detalhe" cx="152" cy="200" rx="16" ry="10" fill="#ffb8d2" opacity=".85"/>
      <ellipse class="detalhe" cx="268" cy="200" rx="16" ry="10" fill="#ffb8d2" opacity=".85"/>

      <!-- boca: abre e fecha de verdade -->
      <g id="grupoBoca">
        <ellipse id="bocaAberta" cx="210" cy="214" rx="26" ry="3" fill="#cd7f95" stroke="var(--traco)" stroke-width="5"/>
        <path id="sorriso" d="M186 210 q24 20 48 0" fill="none" stroke="var(--traco)" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- ============ BRAÇO DIREITO (o que age) ============ -->
      <path id="bracoBorda" class="contorno" d="M296 344 Q332 400 352 464" fill="none" stroke="var(--traco)" stroke-width="26" stroke-linecap="round"/>
      <path id="braco" class="pelestroke" d="M296 344 Q332 400 352 464" fill="none" stroke="#ffe0c9" stroke-width="16" stroke-linecap="round"/>
      <g id="mao">
        <!-- item na mão -->
        <g id="itemPilula" opacity="1" transform="translate(14,-32) scale(1.1)">
          <g transform="rotate(-20)">
            <rect x="-17" y="-8" width="34" height="16" rx="8" fill="#fff" stroke="var(--traco)" stroke-width="4"/>
            <path d="M0 -8 h9 a8 8 0 0 1 0 16 h-9 z" fill="#bfe3ff" stroke="var(--traco)" stroke-width="4"/>
          </g>
        </g>
        <g id="itemCopo" opacity="0">
          <g id="copoRot">
            <path d="M-26 -46 h52 l-7 84 a9 9 0 0 1 -9 8 h-20 a9 9 0 0 1 -9 -8 z" fill="#eef8ff" stroke="var(--traco)" stroke-width="5" stroke-linejoin="round"/>
            <g clip-path="url(#cortaCopo)">
              <rect id="aguaCopo" x="-27" y="-16" width="54" height="70" fill="url(#gAgua)"/>
            </g>
            <path d="M-24 -40 q0 30 4 60" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
          </g>
        </g>
        <circle class="pele contorno" cx="4" cy="12" r="15" fill="url(#gPele)" stroke="var(--traco)" stroke-width="6"/>
      </g>
    </svg>
  </div>

  <div class="painel">
    <button id="btnPilula" class="pisca">💊 Colocar comprimido</button>
    <button id="btnAgua">💧 Beber água</button>
    <button id="btnXray" class="largo destaque">🔍 Ligar raio-X</button>
    <button id="btnReset" class="largo">🔄 Recomeçar</button>
  </div>

  <p class="rodape">Simulador para brincar 💜 Remédio de verdade, só com um adulto.</p>
</div>

<script>
(function(){
  "use strict";
  const $ = s=>document.querySelector(s);

  const cena=$("#cena"), balao=$("#balao");
  const braco=$("#braco"), bracoBorda=$("#bracoBorda"), mao=$("#mao");
  const itemPilula=$("#itemPilula"), itemCopo=$("#itemCopo"), copoRot=$("#copoRot"), aguaCopo=$("#aguaCopo");
  const bocaAberta=$("#bocaAberta"), sorriso=$("#sorriso"), pescoco=$("#pescoco");
  const pilulaDentro=$("#pilulaDentro"), pilulaRot=$("#pilulaDentroRot");
  const aguaDescendo=$("#aguaDescendo"), aguaEstomago=$("#aguaEstomago");
  const estrela=$("#estrela"), estrelaEscala=$("#estrelaEscala"), medida=$("#medida");
  const btnPilula=$("#btnPilula"), btnAgua=$("#btnAgua"), btnXray=$("#btnXray"), btnReset=$("#btnReset"), btnSom=$("#btnSom");

  /* ---------- pontos de referência ---------- */
  const OMBRO   = {x:296, y:344};
  const REPOUSO = {x:352, y:464};
  const NA_BOCA = {x:258, y:254};   // mão logo abaixo da boca, como quem leva algo à boca
  const BOCA    = {y:214};
  const GARGANTA_TOPO = 232, ESTOMAGO = 452;

  let estado = { pilulaNaBoca:false, engoliu:false, ocupado:false, xray:false };

  /* ---------- motor de animação ---------- */
  const suave = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  function anima(dur, passo, easing){
    return new Promise(res=>{
      const e = easing || suave, t0 = performance.now();
      (function frame(agora){
        const t = Math.min(1,(agora-t0)/dur);
        passo(e(t), t);
        t<1 ? requestAnimationFrame(frame) : res();
      })(performance.now());
    });
  }
  const misturar = (a,b,t)=> a + (b-a)*t;
  const espera = ms => new Promise(r=>setTimeout(r,ms));

  /* ---------- desenho ---------- */
  function porMao(x,y){
    mao.setAttribute("transform","translate("+x+","+y+")");
    // o braço acompanha a mão com uma curva simples
    const cx = (OMBRO.x+x)/2 + 46, cy = (OMBRO.y+y)/2 + 6;
    const d = "M"+OMBRO.x+" "+OMBRO.y+" Q"+cx+" "+cy+" "+x+" "+y;
    braco.setAttribute("d", d);
    bracoBorda.setAttribute("d", d);
  }
  function abrirBoca(q){            // q: 0 fechada .. 1 bem aberta
    bocaAberta.setAttribute("ry", misturar(4, 15, q));
    bocaAberta.setAttribute("rx", misturar(18, 22, q));
    bocaAberta.setAttribute("opacity", Math.min(1, q*3));
    sorriso.setAttribute("opacity", 1-Math.min(1,q*2));
  }
  function porPilulaDentro(y, giro){
    pilulaDentro.setAttribute("transform","translate(210,"+y+")");
    pilulaRot.setAttribute("transform","rotate("+(giro||0)+")");
  }
  function porAguaDentro(y){ aguaDescendo.setAttribute("transform","translate(0,"+y+")"); }

  /* ---------- mensagens ---------- */
  function diz(t){
    $("#msg").parentElement.innerHTML = "<span id='msg'>"+t+"</span>";
    balao.classList.add("pop"); setTimeout(()=>balao.classList.remove("pop"),450);
  }

  /* ---------- somzinhos ---------- */
  let audio=null, somOn=true;
  function ctx(){
    if(!audio){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audio=new AC(); }
    if(audio && audio.state==="suspended") audio.resume();
    return audio;
  }
  function nota(f,ini,dur,vol){
    const a=ctx(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type="sine"; o.frequency.setValueAtTime(f,a.currentTime+ini);
    g.gain.setValueAtTime(0,a.currentTime+ini);
    g.gain.linearRampToValueAtTime(vol,a.currentTime+ini+.03);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+ini+dur);
    o.connect(g).connect(a.destination); o.start(a.currentTime+ini); o.stop(a.currentTime+ini+dur+.05);
  }
  function toca(tipo){
    if(!somOn||!ctx()) return;
    if(tipo==="pop"){ nota(620,0,.14,.13); nota(880,.06,.16,.09); }
    if(tipo==="agua"){ [520,470,420,370,330].forEach((f,i)=>nota(f,i*.12,.22,.07)); }
    if(tipo==="engole"){ nota(300,0,.25,.09); nota(220,.18,.3,.07); }
    if(tipo==="sucesso"){ [523,659,784,1047].forEach((f,i)=>nota(f,i*.12,.34,.1)); }
    if(tipo==="clique"){ nota(700,0,.08,.06); }
  }
  const vibra = p => { if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } };

  /* ---------- botões ---------- */
  function atualizarBotoes(){
    btnPilula.disabled = estado.ocupado || estado.pilulaNaBoca || estado.engoliu;
    btnAgua.disabled   = estado.ocupado;
    btnXray.disabled   = false;
    btnReset.disabled  = estado.ocupado;
    btnPilula.classList.toggle("pisca", !estado.pilulaNaBoca && !estado.engoliu && !estado.ocupado);
    btnAgua.classList.toggle("pisca", estado.pilulaNaBoca && !estado.ocupado);
  }

  /* ---------- ação 1: colocar o comprimido na boca ---------- */
  async function colocarPilula(){
    if(estado.ocupado || estado.pilulaNaBoca || estado.engoliu) return;
    estado.ocupado = true; atualizarBotoes();
    diz("Levando o comprimido até a boca…");

    await anima(1000,t=>{
      porMao(misturar(REPOUSO.x,NA_BOCA.x,t), misturar(REPOUSO.y,NA_BOCA.y,t));
      if(t>.55) abrirBoca((t-.55)/.45);
    });
    toca("pop"); vibra(25);
    itemPilula.setAttribute("opacity","0");            // o comprimido entra na boca
    estado.pilulaNaBoca = true;

    await anima(500,t=>abrirBoca(1-t*.75));
    await anima(700,t=>{
      porMao(misturar(NA_BOCA.x,REPOUSO.x,t), misturar(NA_BOCA.y,REPOUSO.y,t));
      abrirBoca(.25*(1-t));
    });
    itemCopo.setAttribute("opacity","1");               // agora a mão pega o copo

    estado.ocupado = false; atualizarBotoes();
    diz(estado.xray
      ? "O comprimido está na boca. Olha só: a garganta é bem mais larga que ele!"
      : "Pronto, está na boca! Agora é só beber água 💧 (pode ligar o raio-X pra ver por dentro)");
  }

  /* ---------- ação 2: beber água (e engolir) ---------- */
  async function beberAgua(){
    if(estado.ocupado) return;
    estado.ocupado = true; atualizarBotoes();
    if(itemCopo.getAttribute("opacity")==="0"){ itemPilula.setAttribute("opacity","0"); itemCopo.setAttribute("opacity","1"); }
    diz("Bebendo a água… glup, glup 💧");

    // leva o copo à boca
    await anima(900,t=>{
      porMao(misturar(REPOUSO.x,NA_BOCA.x,t), misturar(REPOUSO.y,NA_BOCA.y,t));
      if(t>.5) abrirBoca((t-.5)/.5*.8);
    });
    toca("agua"); vibra([20,60,20]);
    // inclina o copo e a água baixa
    await anima(1100,t=>{
      copoRot.setAttribute("transform","rotate("+(-58*t)+")");
      aguaCopo.setAttribute("y", misturar(-16, 46, t));
      aguaCopo.setAttribute("height", Math.max(0, misturar(70, 8, t)));
    });

    // a água entra: comprimido começa a descer
    if(estado.pilulaNaBoca){
      pilulaDentro.setAttribute("opacity","1");
      porPilulaDentro(GARGANTA_TOPO, -14);
      aguaDescendo.setAttribute("opacity","1");
      porAguaDentro(GARGANTA_TOPO-26);
      medida.setAttribute("opacity","1");
    }

    // engole: o pescoço faz o movimento
    toca("engole");
    await anima(700,t=>{
      const s = 1 + .16*Math.sin(t*Math.PI);
      pescoco.setAttribute("transform","translate(210,270) scale("+s+",1) translate(-210,-270)");
      abrirBoca(.8*(1-t));
    });
    pescoco.setAttribute("transform","");

    // copo volta ao lugar
    anima(700,t=>{
      porMao(misturar(NA_BOCA.x,REPOUSO.x,t), misturar(NA_BOCA.y,REPOUSO.y,t));
      copoRot.setAttribute("transform","rotate("+(-58*(1-t))+")");
    });

    if(estado.pilulaNaBoca){
      if(!estado.xray) diz("Desceu! Liga o raio-X 🔍 pra ver onde ele está agora.");
      else diz("Olha! A água empurra e ele escorrega pela garganta…");

      // descida pela garganta até o estômago
      await anima(2600,t=>{
        const y = misturar(GARGANTA_TOPO, ESTOMAGO-18, t);
        porPilulaDentro(y, -14 + Math.sin(t*7)*10);
        porAguaDentro(y-26);
        aguaEstomago.setAttribute("opacity", Math.max(0,(t-.55)/.45*.9));
      });

      estado.pilulaNaBoca = false; estado.engoliu = true;
      aguaDescendo.setAttribute("opacity",".35");
      toca("sucesso"); vibra([40,80,40]);
      estrela.setAttribute("opacity","1");
      await anima(600,t=>{
        estrelaEscala.setAttribute("transform","scale("+misturar(.2,1,t)+") rotate("+misturar(-40,0,t)+")");
      }, t=>1-Math.pow(1-t,3));
      diz(estado.xray
        ? "Chegou no estômago! Viu? A garganta é bem maior que o comprimido — ele desce fácil, com a ajuda da água ⭐"
        : "Chegou no estômago! ⭐ Liga o raio-X 🔍 e faça de novo pra ver o caminho todo.");
    }else{
      diz("Água boa! 💧 Agora experimente colocar o comprimido.");
    }

    estado.ocupado = false; atualizarBotoes();
  }

  /* ---------- raio-X ---------- */
  function alternarXray(){
    estado.xray = !estado.xray;
    cena.classList.toggle("xray", estado.xray);
    document.body.classList.toggle("xray", estado.xray);
    btnXray.textContent = estado.xray ? "🙈 Desligar raio-X" : "🔍 Ligar raio-X";
    btnXray.classList.toggle("xrayOn", estado.xray);
    toca("clique");
    if(estado.xray){
      medida.setAttribute("opacity","1");
      diz(estado.engoliu
        ? "Aí está ele, no estômago — bem pequenininho perto de tudo 😊"
        : "Agora dá para ver por dentro! A garganta é este tubo largo — o comprimido é bem menor que ele.");
    }else{
      diz("Raio-X desligado 😊");
    }
  }

  /* ---------- recomeçar ---------- */
  function recomecar(){
    estado = { pilulaNaBoca:false, engoliu:false, ocupado:false, xray:estado.xray };
    porMao(REPOUSO.x, REPOUSO.y);
    abrirBoca(0);
    itemPilula.setAttribute("opacity","1");
    itemCopo.setAttribute("opacity","0");
    copoRot.setAttribute("transform","rotate(0)");
    aguaCopo.setAttribute("y",-16); aguaCopo.setAttribute("height",70);
    pilulaDentro.setAttribute("opacity","0");
    aguaDescendo.setAttribute("opacity","0");
    aguaEstomago.setAttribute("opacity","0");
    estrela.setAttribute("opacity","0");
    estrelaEscala.setAttribute("transform","scale(1)");
    medida.setAttribute("opacity", estado.xray ? "1" : "0");
    pescoco.setAttribute("transform","");
    porPilulaDentro(GARGANTA_TOPO,-14);
    atualizarBotoes();
    diz("Vamos de novo! Clique em 💊 Colocar comprimido.");
  }

  /* ---------- piscar os olhos de vez em quando ---------- */
  setInterval(()=>{
    if(document.hidden) return;
    const olhos=[$("#olhoE"),$("#olhoD")];
    olhos.forEach(o=>o.setAttribute("ry","2"));
    setTimeout(()=>olhos.forEach(o=>o.setAttribute("ry","14")),140);
  }, 4200);

  btnPilula.addEventListener("click", colocarPilula);
  btnAgua.addEventListener("click", beberAgua);
  btnXray.addEventListener("click", alternarXray);
  btnReset.addEventListener("click", recomecar);
  btnSom.addEventListener("click", ()=>{
    somOn=!somOn; btnSom.textContent = somOn ? "🔊" : "🔇"; if(somOn) toca("clique");
  });

  // estado inicial
  porMao(REPOUSO.x, REPOUSO.y);
  abrirBoca(0);
  porPilulaDentro(GARGANTA_TOPO,-14);
  atualizarBotoes();
})();
</script>
</body>
</html>
